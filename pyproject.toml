[project]
name = "surveyor"
version = "1.0.0"
description = "Turn arXiv LaTeX sources into a map of a research field: import papers and surveys, extract taxonomies and reading lists, and ask questions from a browser, the terminal, or Feishu/WeCom."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["arxiv", "latex", "research", "literature-review", "survey", "llm", "rag"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "cryptography>=42.0",
    "markdown-it-py>=3.0",
    "latex2mathml>=3.77",
]

# Each platform's official SDK, needed only to hold a long connection open:
# `surveyor feishu-connect` and `surveyor wecom-connect` respectively. The webhook
# route works without either.
[project.optional-dependencies]
feishu = ["lark-oapi>=1.7"]
wecom = ["wecom-aibot-python-sdk>=1.0.2"]

[project.urls]
Homepage = "https://github.com/hebing-sjtu/surveyor"
Issues = "https://github.com/hebing-sjtu/surveyor/issues"

# `surveyor` is the canonical command; `paper` is a short alias for daily use.
[project.scripts]
surveyor = "surveyor.cli:app"
paper = "surveyor.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["surveyor*"]

[tool.setuptools.package-data]
"surveyor.gui" = ["static/*"]
